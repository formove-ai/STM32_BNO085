; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; native environment for unit testing
[env:native]
platform = native
test_build_src = true
test_filter = test_parseInputReport
build_flags =
    -D BNO085_BUILD_FOR_INTERNAL_UNIT_TESTS
    -lm
    -I test/include
lib_deps =
    bno085_spi
    symlink://test/bno085_internal_mocks

; Checks that mock/ is consumable the way a downstream project consumes it: the
; library sources are deliberately not built here, so the generated mock
; provides every BNO085 symbol. Keep test_build_src off.
[env:native_mock]
platform = native
test_filter = test_mock_consumer
build_flags =
    -D BNO085_BUILD_WITH_NATIVE_HAL_STUB
    -lm
    -I include
lib_deps =
    symlink://mock
