---
name: Check Mock Freshness

on:
  push:
    paths:
      - "include/BNO085_SPI_Library.h"
      - "mock/**"
      - ".github/workflows/check-mocks.yaml"
    branches:
      - main
  pull_request:
    paths:
      - "include/BNO085_SPI_Library.h"
      - "mock/**"
      - ".github/workflows/check-mocks.yaml"

jobs:
  check-mocks:
    name: Verify Mocks Are Up-to-Date
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      
      - name: Regenerate Mocks
        run: |
          cd mock
          ./generate_mocks.sh
      
      - name: Check for Differences
        run: |
          if git diff --exit-code mock/MockBNO085_SPI_Library.c mock/MockBNO085_SPI_Library.h; then
            echo "✅ Mocks are up-to-date!"
          else
            echo "❌ ERROR: Mocks are stale!"
            echo ""
            echo "The mock files do not match the header file."
            echo "Please regenerate mocks by running:"
            echo "  cd mock && ./generate_mocks.sh"
            echo "or:"
            echo "  docker compose run --build --rm generate-mocks"
            echo ""
            echo "Then commit the updated mock files."
            echo ""
            echo "Diff:"
            git diff mock/MockBNO085_SPI_Library.c mock/MockBNO085_SPI_Library.h
            exit 1
          fi
