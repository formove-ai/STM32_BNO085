# CMock writes MockBNO085_SPI_Library.{c,h} and vendors cmock.{c,h} plus
# cmock_internals.h verbatim. They are regenerated by generate_mocks.sh, so
# style findings in them cannot be fixed here and must not be linted.
exclude_files=MockBNO085_SPI_Library\.(c|h)
exclude_files=cmock\.(c|h)
exclude_files=cmock_internals\.h
